schema_version: "1.1"
name: code-remboursement-prorata
expected_outcome: |
  Planted errors: the period length excludes its last day (January counted as 30 days, so 29.90 EUR refunded
  15 days gives 14.95 instead of 14.47) and the existing test asserts that wrong value; Python round on floats
  is half-even and binary (9.99 EUR, April, cancellation on April 5: 8.325 gives 8.32 instead of 8.33); no
  guard for a cancellation outside the period (negative or over 100 percent refund) or a one-day period
  (division by zero). A good result finds them with concrete scenarios, proves at least one by running code,
  does not change the user's files before agreement, and says clearly the code is not ready to merge.
context:
  scaffold_script: place-files.sh
